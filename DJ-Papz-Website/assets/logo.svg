  <!-- vinyl record -->
  <circle cx="60" cy="60" r="27" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="60" cy="60" r="19" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.55"/>
  <circle cx="60" cy="60" r="12.5" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.4"/>
  <circle cx="60" cy="60" r="4.4" fill="url(#gold)"/>
  <!-- tonearm -->
  <line x1="92" y1="30" x2="70.5" y2="50.5" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round"/>
  <circle cx="92" cy="30" r="3.4" fill="url(#gold)"/>
  <rect x="66.5" y="47.5" width="8.5" height="5" rx="1.2" transform="rotate(-43 70.75 50)" fill="url(#gold)"/>
</svg>
