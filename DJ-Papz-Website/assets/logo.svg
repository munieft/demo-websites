<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="DJ Papz emblem">
  <defs>
    <linearGradient id="gold" x1="18" y1="10" x2="102" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7E3A3"/>
      <stop offset="0.42" stop-color="#E7B84E"/>
      <stop offset="0.72" stop-color="#C9962F"/>
      <stop offset="1" stop-color="#8E6413"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#2a1830"/>
      <stop offset="1" stop-color="#0d0712"/>
